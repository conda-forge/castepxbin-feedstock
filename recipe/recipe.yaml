schema_version: 1

context:
  name: castepxbin
  version: "0.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/castepxbin-${{ version }}.tar.gz
  sha256: 1761a28a2d2976ab1e0121198bd1f1d9bcabd8163cb1509b0ac9933e9d7e6375

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - flit-core
  run:
    - numpy >=1,<2
    - python >=${{ python_min }}
    - scipy >=1,<2

tests:
  - python:
      imports:
        - castepxbin
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Reading binary files generated by CASTEP in Python
  description: |
    A collection of readers for CASTEP binary output from CASTEP. At the
    moment, there is only a reader for pdos_dos file available. This file
    contains the weights of the eigenvalues on each projected orbitals,
    which can be used to constructed projected density of states.
  homepage: https://github.com/zhubonan/castepxbin
  repository: https://github.com/zhubonan/castepxbin
  documentation: https://github.com/zhubonan/castepxbin

extra:
  recipe-maintainers:
    - jan-janssen
